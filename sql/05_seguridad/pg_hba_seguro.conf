# =====================================================================
# pg_hba.conf - Politica de Acceso Seguro (Rol 3 -> Rol 2)
# Exige SSL/TLS (hostssl) y autenticacion SCRAM-SHA-256 en toda red TCP.
# =====================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# 1. Socket Unix local dentro del contenedor (administracion via docker exec)
local   all             all                                     trust
local   replication     all                                     trust

# 2. Rechazar explicitamente cualquier conexion TCP sin cifrado TLS
hostnossl all           all             all                     reject
hostnossl replication   all             all                     reject

# 3. Replicacion fisica entre primario y standby: TLS + SCRAM-SHA-256
hostssl replication     replicador      all                     scram-sha-256

# 4. Clientes, FDW, generador de carga y administracion remota: TLS + SCRAM-SHA-256
hostssl all             all             all                     scram-sha-256
