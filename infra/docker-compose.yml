# 3 fragmentos (uno por terminal) x (1 primario + 1 standby) = 6 contenedores.
# Los roles NO son fijos: tras un failover, nodoNsb queda como primario (ver scripts/rejoin.sh).
name: portuaria

x-pg: &pg
  image: postgres:16
  entrypoint: ["/bin/bash", "/entrypoint.sh"]
  command:
    - "-c"
    - "wal_level=replica"
    - "-c"
    - "max_wal_senders=10"
    - "-c"
    - "max_replication_slots=10"
    - "-c"
    - "hot_standby=on"
    - "-c"
    - "wal_log_hints=on"
    - "-c"
    - "max_prepared_transactions=20"
    - "-c"
    - "shared_buffers=128MB"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d puerto"]
    interval: 3s
    timeout: 3s
    retries: 20
  networks: [portuaria_net]

x-env: &pgenv
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en infra/.env (copia .env.example a .env)}
  POSTGRES_DB: puerto
  REPL_PASS: ${REPL_PASS:?Falta REPL_PASS en infra/.env (copia .env.example a .env)}

services:
  nodo1:
    <<: *pg
    hostname: nodo1
    ports: ["5441:5432"]
    environment: {<<: *pgenv, MODO: "${N1_MODO:-primario}", PEER: "${N1_PEER:-nodo1sb}", SLOT: slot_nodo1}
    volumes: [nodo1_data:/var/lib/postgresql/data, "./entrypoint.sh:/entrypoint.sh:ro", "./init:/docker-entrypoint-initdb.d:ro", "../datos:/datos:ro"]
  nodo1sb:
    <<: *pg
    hostname: nodo1sb
    ports: ["5451:5432"]
    environment: {<<: *pgenv, MODO: "${N1SB_MODO:-standby}", PEER: nodo1, SLOT: slot_nodo1sb}
    volumes: [nodo1sb_data:/var/lib/postgresql/data, "./entrypoint.sh:/entrypoint.sh:ro", "./init:/docker-entrypoint-initdb.d:ro", "../datos:/datos:ro"]
  nodo2:
    <<: *pg
    hostname: nodo2
    ports: ["5442:5432"]
    environment: {<<: *pgenv, MODO: "${N2_MODO:-primario}", PEER: "${N2_PEER:-nodo2sb}", SLOT: slot_nodo2}
    volumes: [nodo2_data:/var/lib/postgresql/data, "./entrypoint.sh:/entrypoint.sh:ro", "./init:/docker-entrypoint-initdb.d:ro", "../datos:/datos:ro"]
  nodo2sb:
    <<: *pg
    hostname: nodo2sb
    ports: ["5452:5432"]
    environment: {<<: *pgenv, MODO: "${N2SB_MODO:-standby}", PEER: nodo2, SLOT: slot_nodo2sb}
    volumes: [nodo2sb_data:/var/lib/postgresql/data, "./entrypoint.sh:/entrypoint.sh:ro", "./init:/docker-entrypoint-initdb.d:ro", "../datos:/datos:ro"]
  nodo3:
    <<: *pg
    hostname: nodo3
    ports: ["5443:5432"]
    environment: {<<: *pgenv, MODO: "${N3_MODO:-primario}", PEER: "${N3_PEER:-nodo3sb}", SLOT: slot_nodo3}
    volumes: [nodo3_data:/var/lib/postgresql/data, "./entrypoint.sh:/entrypoint.sh:ro", "./init:/docker-entrypoint-initdb.d:ro", "../datos:/datos:ro"]
  nodo3sb:
    <<: *pg
    hostname: nodo3sb
    ports: ["5453:5432"]
    environment: {<<: *pgenv, MODO: "${N3SB_MODO:-standby}", PEER: nodo3, SLOT: slot_nodo3sb}
    volumes: [nodo3sb_data:/var/lib/postgresql/data, "./entrypoint.sh:/entrypoint.sh:ro", "./init:/docker-entrypoint-initdb.d:ro", "../datos:/datos:ro"]

networks:
  portuaria_net: {name: portuaria_net}

volumes:
  nodo1_data:   {name: portuaria_nodo1_data}
  nodo1sb_data: {name: portuaria_nodo1sb_data}
  nodo2_data:   {name: portuaria_nodo2_data}
  nodo2sb_data: {name: portuaria_nodo2sb_data}
  nodo3_data:   {name: portuaria_nodo3_data}
  nodo3sb_data: {name: portuaria_nodo3sb_data}
